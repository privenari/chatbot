services:
  postgres:
    image: postgres:16
    container_name: postgresql_db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - chatbot_net
    healthcheck:
      # Los $$ permiten usar las variables de entorno dentro del propio contenedor
      test: ["CMD-SHELL", "pg_isready -h localhost -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:2.2.4
    container_name: privenari_n8n
    restart: always
    # ports:
    environment:
      - N8N_HOST=${DOMAIN_NAME}
      - N8N_PORT=${N8N_PORT}
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://${DOMAIN_NAME}/
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ./n8n_data:/home/node/.n8n
    networks:
      - chatbot_net
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:latest
    container_name: privenari_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx_config/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - chatbot_net
    depends_on:
      - n8n

  api:
    build: ./api
    container_name: privenari_api
    restart: always
    # ports:
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - BUSINESS_DB=${BUSINESS_DB}
    networks:
      - chatbot_net
    depends_on:
      postgres:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    container_name: privenari_ollama
    restart: always
    # ports:
    volumes:
      - ./ollama_data:/root/.ollama
    networks:
      - chatbot_net

networks:
  chatbot_net:
    external: true
